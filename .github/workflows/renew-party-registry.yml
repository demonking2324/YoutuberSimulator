name: Renew party registry

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/renew-party-registry.yml"

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create jsonblob registry
        id: blob
        run: |
          RESP=$(curl -sD - -X POST "https://jsonblob.com/api/jsonBlob" \
            -H "Content-Type: application/json" \
            --data '{"players":{},"invites":{},"parties":{},"updatedAt":0}')
          echo "$RESP"
          ID=$(printf '%s' "$RESP" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-jsonblob-id" {print $2; exit}')
          if [ -z "$ID" ]; then
            echo "Failed to create jsonblob"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          printf '{\n  "blobId": "%s"\n}\n' "$ID" > registry.json

      - name: Commit registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --staged --quiet; then
            echo "No registry change"
            exit 0
          fi
          git commit -m "Renew party registry blob"
          git push
